{% extends "blog_app/base.html" %}

{% block title %}Adicionar um comentário{% endblock %}

{% block content %}
  {% if comment %}
    <h2>Seu comentário foi adicionado.</h2>
    <p><a href="{{ post.get_absolute_url }}">Voltar para o post</a></p>
  {% else %}
    {% include "blog_app/post/includes/comment_form.html" %}
  {% endif %}
{% endblock %}
